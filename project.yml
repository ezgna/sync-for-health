# HealthBridge — personal fork of Sync for Health (Salute Libera).
# Rigenera il progetto con:  xcodegen generate
name: SaluteLibera
options:
  bundleIdPrefix: app.ezgna
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
  createIntermediateGroups: true
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Select your own signing team in Xcode; no upstream team is embedded.
    CODE_SIGN_STYLE: Automatic

targets:
  SaluteLibera:
    type: application
    platform: iOS
    sources:
      - path: SaluteLibera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ezgna.healthbridge
        PRODUCT_NAME: HealthBridge
        INFOPLIST_FILE: SaluteLibera/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SaluteLibera/Resources/SaluteLibera.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: SaluteLibera/Resources/SaluteLibera.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

schemes:
  SaluteLibera:
    build:
      targets:
        SaluteLibera: all
    run:
      config: Debug
    archive:
      config: Release
